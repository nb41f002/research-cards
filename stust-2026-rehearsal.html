<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>南臺口頭發表排練台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --paper:#F7F1EC; --surface:#FFFDF9; --tint:#E8ECE3; --line:#D5DBCF;
  --ink:#1F2A22; --body:#34423A; --muted:#5F6B62;
  --forest:#16422A; --deep:#2C523E; --sage:#7F957C;
  --on-forest:#F7F1EC;
  --ok:#2F6B45; --warn:#9A6212; --bad:#A33A2B;
  --hi-bg:#F6E3DF; --mid-bg:#F4EAD7; --low-bg:#E6EAE4;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1D15; --surface:#15271C; --tint:#1C3325; --line:#2A4234;
    --ink:#E9EDE6; --body:#CFD8CE; --muted:#9AA99C;
    --forest:#9CC7A6; --deep:#7FB08C; --sage:#8FA98F; --on-forest:#0F1D15;
    --ok:#7CC493; --warn:#E0B062; --bad:#F08A7A;
    --hi-bg:#3A221D; --mid-bg:#382C18; --low-bg:#1E2C23;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1D15; --surface:#15271C; --tint:#1C3325; --line:#2A4234;
  --ink:#E9EDE6; --body:#CFD8CE; --muted:#9AA99C;
  --forest:#9CC7A6; --deep:#7FB08C; --sage:#8FA98F; --on-forest:#0F1D15;
  --ok:#7CC493; --warn:#E0B062; --bad:#F08A7A;
  --hi-bg:#3A221D; --mid-bg:#382C18; --low-bg:#1E2C23;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);color:var(--forest);text-wrap:balance;margin:0}
header.top{padding-block:28px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(28px,5vw,40px);font-weight:900;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
/* 計時列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line)}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.clock{font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.clock b{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--forest);line-height:1}
.clock span{font-size:13px;color:var(--muted)}
.now{font-size:14px;color:var(--ink)}
.now em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
button{font:inherit;font-size:14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
button.primary{background:var(--forest);border-color:var(--forest);color:var(--on-forest);font-weight:700}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.strip{display:flex;gap:2px;margin-top:10px;height:10px}
.strip i{display:block;height:100%;background:var(--tint);border-radius:2px;cursor:pointer}
.strip i.done{background:var(--sage)}
.strip i.cur{background:var(--forest)}
.legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
/* 分頁 */
nav.tabs{display:flex;gap:4px;margin-block:18px 6px;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted);font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--forest);border-bottom-color:var(--forest)}
/* 講稿 */
.chapter{font-size:13px;letter-spacing:.1em;font-weight:700;color:var(--sage);margin-block:26px 4px}
.slide{display:grid;grid-template-columns:184px 1fr;gap:18px;padding:16px 12px;border-bottom:1px solid var(--line);border-radius:8px;scroll-margin-top:150px}
.slide.cur{background:var(--tint)}
.slide img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:4px;display:block}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.shead h3{font-size:20px;font-weight:900}
.no{font-family:var(--serif);font-weight:900;color:var(--sage);font-size:15px}
.t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.lap{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.lap.ok{color:var(--ok)}.lap.warn{color:var(--warn)}.lap.bad{color:var(--bad)}
.script{font-size:17px;line-height:2;color:var(--ink);margin:6px 0 4px;max-width:62ch}
.script strong{color:var(--forest)}
.pause{display:inline-block;font-size:12px;line-height:1;padding:3px 6px;margin:0 4px;border-radius:999px;background:var(--forest);color:var(--on-forest);font-weight:700;vertical-align:2px}
.br{color:var(--sage);margin:0 .35em;font-weight:700}
.src{font-size:13px;color:var(--muted);margin:0}
.skip{display:inline-block;font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-top:4px}
/* 快答 */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:12px}
.tools input{flex:1 1 220px;font:inherit;font-size:15px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip{font-size:13px;padding:4px 10px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.qa{list-style:none;padding:0;margin:0}
.qa li{padding:12px 4px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:5.5em 1fr;gap:4px 12px}
.qa .cat{font-size:12px;color:var(--muted);font-weight:700;padding-top:4px}
.qa .q{font-weight:700;color:var(--ink)}
.qa .a{grid-column:2;color:var(--body)}
.empty{color:var(--muted);padding:16px 4px}
/* 攻訐點 */
.atk{padding:18px 4px;border-bottom:1px solid var(--line)}
.atk h3{font-size:19px;font-weight:900;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.risk{font-family:var(--sans);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.risk.高{background:var(--hi-bg);color:var(--bad)}.risk.中{background:var(--mid-bg);color:var(--warn)}.risk.低{background:var(--low-bg);color:var(--muted)}
.atk dl{display:grid;grid-template-columns:6.5em 1fr;gap:6px 14px;margin:10px 0 0}
.atk dt{font-size:13px;color:var(--muted);font-weight:700;padding-top:2px}
.atk dd{margin:0}
.atk dd.ans{background:var(--tint);border-radius:6px;padding:10px 12px;color:var(--ink);font-size:16.5px}
.note{font-size:13px;color:var(--muted);margin-top:28px;max-width:70ch}
@media (max-width:640px){
  .slide{grid-template-columns:1fr;gap:10px;padding-inline:4px}
  .slide img{max-width:320px}
  .btns{margin-left:0}
  .qa li{grid-template-columns:1fr}.qa .a{grid-column:1}
  .atk dl{grid-template-columns:1fr}.atk dt{padding-top:6px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>

</div>

<script>
const DATA = {"version": "v10（2026-09-22）", "total": 540, "slides": [{"no": 1, "title": "封面", "chapter": "開場", "sec": 20, "acc": 20, "hidden": false, "script": "各位老師好，我是南臺科技大學教育經營所研究生**葉容辰**，指導教授是**李嘉宜**老師。〔停〕今天的題目是：**生成式 AI 支持下，仍存在學習落差嗎？**〔停〕", "source": "正式題名依南臺投稿摘要；資料依 20260808 第七版鎖定主表（498 人）。", "skip": ""}, {"no": 2, "title": "概念具象化困境", "chapter": "第一章 緒論", "sec": 30, "acc": 50, "hidden": false, "script": "先從課堂現象說起。／學生心裡常有想說的故事，／例如：「畢業的時候，有一點難過，也期待新的開始。」〔停〕要把這句話交給 AI，／還需要寫出主題、情緒、曲風和表達方式。／我把這段落差稱為**概念具象化困境**，這是研究者的工作用語。", "source": "沿用陽明交大報告的工作用語；頁面文字為研究者擬寫的教學示例。", "skip": ""}, {"no": 3, "title": "研究問題與觀察指標", "chapter": "第一章 緒論", "sec": 25, "acc": 75, "hidden": false, "script": "原摘要關注三件事：／**基礎技能、創作參與、群體成果**。〔停〕對應的紀錄是中文打字、作品與提示詞，以及 SEN 和一般學生的作業分。／今天先報告已經核對過的描述資料。", "source": "原摘要三題的推論設計保留在備用頁 20。", "skip": ""}, {"no": 4, "title": "依學生反應調整支持", "chapter": "第二章 文獻探討", "sec": 35, "acc": 110, "hidden": false, "script": "第一個理論基礎是**鷹架**。／概念由 Wood 等人提出；van de Pol 等人回顧十年研究，整理出兩個重點：〔停〕第一，依學生當下的表現調整協助；／第二，支持逐步撤出，把責任交給學生。／本課程的三層支持就這樣安排：／**主題框架、提示詞網站、互動修訂**。", "source": "Wood et al. (1976)；van de Pol et al. (2010)。", "skip": ""}, {"no": 5, "title": "參與障礙與學習設計", "chapter": "第二章 文獻探討", "sec": 35, "acc": 145, "hidden": false, "script": "第二個理論基礎是**通用學習設計，UDL**。〔停〕課程用圖卡和範例呈現任務，／用提示詞欄位協助表達，／也把主題和風格留給學生選。／Rao 等人回顧 13 項研究，提醒實施和評估要寫具體；／Zhao 等人調查 124 位大學身障學生，看到培訓與資源的需求。", "source": "CAST (2024)；Rao et al. (2014)；Zhao et al. (2025)。Zhao 為高等教育調查，與國中情境分開看。", "skip": "Zhao 等人調查那一句（約 6 秒）"}, {"no": 6, "title": "AI 音樂學習的現場證據", "chapter": "第二章 文獻探討", "sec": 30, "acc": 175, "hidden": false, "script": "AI 音樂教學的實證多半在大學。／例如 Liu 等人的大學樂理課程，**43 位**學生上四週，／作者報告 AI 回饋組的學習結果和感受比較好。〔停〕本研究在國中科技課程，／學段、任務和評量都不同，／所以需要國中現場的資料。", "source": "Liu et al. (2025)：AI 回饋組 22 人、傳統混成組 21 人；本案查閱摘要與 Participants 段落。Miao & Holmes (2023) 提供教育公平方向。", "skip": "「學段、任務和評量都不同」一句（約 4 秒）"}, {"no": 7, "title": "兩學期、兩個創作單元", "chapter": "第三章 研究方法", "sec": 30, "acc": 205, "hidden": false, "script": "課程分兩個學期。／同一批 18 班學生，**上學期學 AI 繪圖，下學期學 AI 作曲**，各六節課。〔停〕繪圖用提示詞公式和圖卡；／作曲從歌曲結構、曲風開始，再寫提示詞、生成、修訂。／兩個任務各自依課程規則評分。", "source": "課時經作者 2026-09-18 確認；六份教師教材。照片為橢圓人臉模糊副本。", "skip": ""}, {"no": 8, "title": "提示詞如何教、如何練", "chapter": "第三章 研究方法", "sec": 30, "acc": 235, "hidden": false, "script": "提示詞怎麼教？〔停〕教材把提示詞拆成**六個欄位**：／語言、主題、內容、押韻、演唱方式、曲風。／右邊是教材第 46 頁的範本。／學生先選主題，再用網站整理需求，／生成之後比較、修改。／這讓我們能追蹤學生填了哪些條件、怎麼改寫。", "source": "《AI音樂創作及SUNO作曲教學》第 46 頁；網站 https://sites.google.com/view/sunov5/home 。", "skip": ""}, {"no": 9, "title": "研究對象與資料來源", "chapter": "第三章 研究方法", "sec": 30, "acc": 265, "hidden": false, "script": "研究對象是一所公立國中，七、八年級 18 班，／鎖定母體 **498 人**，其中 SEN 35 人，名單不含資優生。〔停〕每種資料各有有效範圍：／AI 繪圖 493 筆，SUNO 487 筆，兩項都有效 486 筆。／後面的圖表都會標出分母。", "source": "20260808 第七版鎖定主表；SEN 定義經作者 2026-09-18 確認。", "skip": ""}, {"no": 10, "title": "60 分代表什麼？", "chapter": "第三章 研究方法", "sec": 30, "acc": 295, "hidden": false, "script": "接著交代一個重要的給分規則。〔停〕**剛好 60 分**，代表學生有繳交歌曲，／但提示詞沒填，或直接複製範本。／**低於 60 分**，是沒有繳交作業，依平常表現給分。〔停〕所以分析時，分數、作品和提示詞要一起看。", "source": "作者 2026-09-18 兩次澄清；歷史行政給分例外依原始紀錄辨別。", "skip": ""}, {"no": 11, "title": "操作紀錄與作品留存", "chapter": "第四章 研究結果", "sec": 35, "acc": 330, "hidden": false, "script": "先看操作紀錄。／467 位學生有中文打字紀錄，／最高有效速度平均每分鐘 **29.21 字**，中位數 27 字。〔停〕作品方面，AI 繪圖有 **468 人**、SUNO 有 **491 人**的作品可以追溯。／這些是描述資料；／前後有沒有進步，要依時間和繳交規則另外配對分析。", "source": "打字為各人最高有效紀錄，屬描述；可追溯為 Padlet 追溯欄位，與正式繳交率分開。", "skip": "最後「前後有沒有進步…」一句（約 5 秒）"}, {"no": 12, "title": "兩組原始平均差 3.48 分", "chapter": "第四章 研究結果", "sec": 30, "acc": 360, "hidden": false, "script": "再看 SUNO 作業分。〔停〕487 筆有效分數中，／一般學生 456 人，平均 **74.87 分**；／SEN 學生 31 人，平均 **71.39 分**；／原始差距 **3.48 分**。〔停〕兩組標準差都在 9 到 10 分之間，／這是還沒有調整的原始平均。", "source": "一般 34140÷456；SEN 2213÷31；SD 採 n−1。", "skip": ""}, {"no": 13, "title": "分數與作品紀錄分層看", "chapter": "第四章 研究結果", "sec": 35, "acc": 395, "hidden": false, "script": "平均數之外，我們再分層看。〔停〕剛好 60 分的比例，／一般學生是 11.6%，／SEN 學生是 **25.8%**，大約每四位就有一位。〔停〕依給分規則，這些學生有交歌曲，提示詞還需要更多支持。／另外 11 筆分數無效，其中 4 筆仍找得到作品。", "source": "60 分比例分母為有效分數（456、31）；無效比例分母為母體（463、35）。", "skip": ""}, {"no": 14, "title": "三位學生的創作入口", "chapter": "第四章 研究結果", "sec": 60, "acc": 455, "hidden": false, "script": "數字之外，我想介紹三位學生。〔停〕**個案 A** 是特殊教育需求學生，平常書寫比較吃力，一開始多只打一個名詞。／在圖卡和特教助理員協助下，寫出「一隻貓在右邊樹下」、「一隻鳥在天上飛，秋天」。〔停〕**個案 B** 經鑑定為注意力不足過動症，過去約五到八分鐘就會分心；／這個任務專注超過二十分鐘，還用同一組提示詞連續生成三張。〔停〕**個案 C** 平常在家自學，這個單元期間每週回學校上課。〔停〕同一套鷹架，讓不同起點的學生都找到進入創作的路。", "source": "113 學年上學期 AI 繪圖單元；研究者課堂觀察與 Padlet 作品。對應東海／國北教論文的 S1、S2、S5。", "skip": ""}, {"no": 15, "title": "一首離別主題的歌曲", "chapter": "第四章 研究結果", "sec": 30, "acc": 485, "hidden": false, "script": "作曲作品也看得到這種具體化。〔停〕這首〈奔向各自的下一站〉，學生把畢業離別寫進提示詞：／「青春總是過得飛快，終於到了該分別的時候……」／並設定中文、男聲獨唱和三種曲風。／右邊是課程歌曲的彙整畫面。", "source": "AI作曲提示詞紀錄.xlsx 第 61 列；https://suno.com/s/SmDYj39AWFmEfv1j（現場不播放）。", "skip": "最後「右邊是課程歌曲的彙整畫面」（約 3 秒）"}, {"no": 16, "title": "學習支持落在創作歷程", "chapter": "第五章 討論與結論", "sec": 45, "acc": 530, "hidden": false, "script": "最後整理三點。〔停〕第一，作品留存、提示詞完成度和課程分數，各自呈現不同的學習資訊，要分開看。／第二，SEN 學生剛好 60 分的比例是 25.8%，提示詞是需要加強支持的環節。〔停〕第三，三位個案讓我們看到，同一套鷹架可以提供不同的進入點。／研究範圍是一所國中、兩學期的科技課程，各任務依自己的評量規則解讀。", "source": "van de Pol et al. (2010)；Rao et al. (2014)。", "skip": ""}, {"no": 17, "title": "Q&A", "chapter": "結尾", "sec": 10, "acc": 540, "hidden": false, "script": "以上是我的報告。〔停〕謝謝各位老師，歡迎指教。", "source": "QR 連到研究小卡口頭版（nb41f002.github.io/research-cards/stust-2026-zh.html），內含教材、作品連結與作品集。", "skip": ""}, {"no": 18, "title": "參考文獻（1／2）", "chapter": "備用", "sec": 0, "acc": 540, "hidden": true, "script": "（隱藏頁）提問時查閱書目。", "source": "APA 第七版。", "skip": ""}, {"no": 19, "title": "參考文獻（2／2）", "chapter": "備用", "sec": 0, "acc": 540, "hidden": true, "script": "（隱藏頁）提問時查閱書目。", "source": "APA 第七版。", "skip": ""}, {"no": 20, "title": "原研究問題與分析設計", "chapter": "備用", "sec": 0, "acc": 540, "hidden": true, "script": "（隱藏頁）被問到摘要的推論統計時使用：原設計保留三題；498 人版的配對與模型仍在複核，主講呈現描述資料。", "source": "原 495 人 p 值未挪用到 498 人。", "skip": ""}, {"no": 21, "title": "分母與紀錄的對照", "chapter": "備用", "sec": 0, "acc": 540, "hidden": true, "script": "（隱藏頁）一般學生母體 463、分數可用 456、無效 7；SEN 母體 35、可用 31、無效 4。60 分比例用有效分數當分母；無效比例用母體。", "source": "20260808 第七版鎖定主表。", "skip": ""}], "quick": [{"cat": "研究設計", "q": "這是什麼研究設計？", "a": "一所國中七、八年級 18 班，兩學期既有課程紀錄的量化描述，再加三位學生個案。"}, {"cat": "研究設計", "q": "為什麼沒有對照組？", "a": "資料來自既有教學；本研究描述支持下兩組的分布，效果檢驗需要對照設計，列為下一步。"}, {"cat": "研究設計", "q": "兩學期任務不同，怎麼比較？", "a": "繪圖分和作曲分各依自己的評分規則解讀，沒有直接相減。"}, {"cat": "樣本", "q": "為什麼是 498 人？", "a": "起始 504 人，6 人轉出或離開研究班級，兩學期配對後為 498 人。"}, {"cat": "樣本", "q": "為什麼各分析的 N 不同？", "a": "依變項的有效資料：AI 繪圖 493、SUNO 487、兩項都有 486。"}, {"cat": "樣本", "q": "SEN 有幾位？怎麼認定？", "a": "35 位，有效 SUNO 分數 31 位；依學校特教名冊，名單不含資優生。"}, {"cat": "樣本", "q": "缺交算零分嗎？", "a": "缺交、分數無效、無作品分開記錄；平均只用有效分數。"}, {"cat": "結果", "q": "兩組平均各是多少？", "a": "一般 74.87 分（n＝456，SD 9.38）；SEN 71.39 分（n＝31，SD 9.77）。"}, {"cat": "結果", "q": "差距 3.48 分算大嗎？", "a": "約 0.37 個標準差（依簡報平均與標準差換算，未做檢定）；分層看 60 分比例更清楚。"}, {"cat": "結果", "q": "有顯著嗎？", "a": "顯著性要用同一版資料重算模型後報告；今天呈現核對過的描述統計。"}, {"cat": "結果", "q": "60 分代表什麼？", "a": "有繳交歌曲，但提示詞未填或直接複製範本。低於 60 是未繳交。"}, {"cat": "結果", "q": "打字速度有進步嗎？", "a": "今天報告的是 467 人最高有效速度 29.21 字／分；進步要用同一時間點配對另算。"}, {"cat": "結果", "q": "作品留存多少？", "a": "AI 繪圖 468 人、SUNO 491 人可追溯（分母 498）。"}, {"cat": "個案", "q": "三位個案怎麼選的？", "a": "同一課程 AI 繪圖單元中，需求類型不同、作品與提示詞都留在 Padlet 的三位學生。"}, {"cat": "個案", "q": "個案 B 專注 20 分鐘怎麼量？", "a": "研究者課堂觀察，對照該生過去約 5–8 分鐘就分心的紀錄；屬個案描述。"}, {"cat": "個案", "q": "助理員協助後還算學生作品嗎？", "a": "依課堂觀察，句子由學生寫出；助理員提供提示與鼓勵，這正是鷹架。"}, {"cat": "課程", "q": "三層鷹架是什麼？", "a": "主題框架形成情境、提示詞網站整理需求、互動修訂比較與選擇。"}, {"cat": "課程", "q": "六欄提示詞是哪六欄？", "a": "語言、主題、內容、押韻、演唱方式、曲風。"}, {"cat": "課程", "q": "學生的創作主體性在哪？", "a": "看主題選擇、提示詞修改、作品比較和修改理由。"}, {"cat": "課程", "q": "沒有音樂背景的老師能用嗎？", "a": "可以從主題、情緒、語言和作品比較開始；涉及樂理再找專業支援。"}, {"cat": "倫理", "q": "學生照片與作品怎麼處理？", "a": "照片做橢圓人臉遮蔽，作品以代號呈現，依學校規範使用帳號。"}, {"cat": "範圍", "q": "結果可以推廣嗎？", "a": "來自單一學校；鷹架和紀錄方式可參考，成效要在新場域重新檢驗。"}, {"cat": "範圍", "q": "下一步是什麼？", "a": "同一版資料重算推論統計、加入第二位評分者、依支持需求細分 SEN。"}, {"cat": "範圍", "q": "數字和摘要不同？", "a": "投稿後複核名冊，母體更新為 498 人、SEN 35 人；推論結果依新版重算中。"}], "attacks": [{"level": "高", "point": "摘要寫的推論結果去哪了？", "ask": "「摘要有 McNemar、ANCOVA 和 p 值，簡報怎麼只剩平均數？」", "why"     : '<li class="empty">找不到符合的問題，換個關鍵字試試。</li>';
}
$('#cats').onclick = e => { const c = e.target.dataset.c; if (!c) return; cat = c; document.querySelectorAll('#cats .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === c)); drawQA(); };
$('#qsearch').oninput = drawQA;
drawQA();

// ── 可能被攻訐 ──
$('#p-attack').innerHTML = '<p class="meta" style="margin:12px 4px 0">依風險排序。回答原則：先謝謝提問，先給一句結論，再指出頁面或後續計畫。</p>' +
  DATA.attacks.map((a, i) => `<article class="atk"><h3><span class="risk ${a.level}">風險${a.level}</span>${i + 1}. ${esc(a.point)}</h3>
  <dl><dt>可能的問法</dt><dd>${esc(a.ask)}</dd><dt>為什麼會被問</dt><dd>${esc(a.why)}</dd>
  <dt>建議回答</dt><dd class="ans">${esc(a.answer)}</dd><dt>可翻的頁</dt><dd>${esc(a.backup)}</dd><dt>避免</dt><dd>${esc(a.avoid)}</dd></dl></article>`).join('');

// ── 分頁 ──
const tabs = ['script', 'quick', 'attack'];
function show(t) {
  tabs.forEach(x => { $('#tab-' + x).setAttribute('aria-selected', x === t); $('#p-' + x).hidden = x !== t; });
  store.set('tab', t);
}
tabs.forEach(t => $('#tab-' + t).onclick = () => show(t));
show(store.get('tab', 'script'));
paint();
</script>

</body></html>
